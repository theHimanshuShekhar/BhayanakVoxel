# Every Material of the game (decision in #15). One `[[material]]` table each; adding a Material
# is adding a table here, with the next free `id`, and needs no code change.
#
# Ids are stable: they are stored in saved Planets and sent over the network, so never renumber
# or reuse one. Ids 1 (rock) and 2 (soil) are what the Planet generator places (ADR 0003).
#
# Every property must be given; a missing or unknown one is a load error.
#
#   id                  16-bit, unique.
#   name                not empty, and unique ignoring case; what the palette panel searches.
#   category            "natural", "building" or "light".
#   colour              base albedo, linear RGB, each 0..1.
#   noise_scale         edge, in Voxels, of the patches the variation below changes over (> 0).
#   hue_jitter          most the hue is turned either way per patch, in degrees (0..180).
#   value_jitter        most the brightness is scaled either way per patch, as a fraction (0..1).
#   roughness           0 mirror-smooth .. 1 fully diffuse.
#   metalness           0 dielectric .. 1 metal.
#   emissive            colour of the light it gives off, linear RGB, each 0..1.
#   emissive_intensity  multiplier on `emissive`, as a multiple of the sun's radiance; 0 for none.
#   transparency        0 opaque .. 1 clear.
#   ior                 index of refraction (>= 1); 1 for opaque Materials.
#   hardness            how long it takes to dig, 0 (none) .. 10 (slowest); soil 2, rock 6.
#   density             kg/m^3; the mass of Debris made of it.
#   fluid               "none", "water", "sand" or "lava": how it flows once Fluids exist.
#
# Glass (transparency, ior) and metalness are stored now; only M1b shades them.

