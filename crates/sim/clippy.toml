# Generation must be bit-identical on every machine (ADR 0003). std's transcendentals and
# powi/powf vary by platform and Rust version, and HashMap iteration order is random.
# If a transcendental is ever needed, use the `libm` crate with an exact `=` version pin.
disallowed-methods = [
    { path = "f32::sin", reason = "platform-dependent; use libm" },
    { path = "f32::cos", reason = "platform-dependent; use libm" },
    { path = "f32::tan", reason = "platform-dependent; use libm" },
    { path = "f32::asin", reason = "platform-dependent; use libm" },
    { path = "f32::acos", reason = "platform-dependent; use libm" },
    { path = "f32::atan", reason = "platform-dependent; use libm" },
    { path = "f32::atan2", reason = "platform-dependent; use libm" },
    { path = "f32::sin_cos", reason = "platform-dependent; use libm" },
    { path = "f32::sinh", reason = "platform-dependent; use libm" },
    { path = "f32::cosh", reason = "platform-dependent; use libm" },
    { path = "f32::tanh", reason = "platform-dependent; use libm" },
    { path = "f32::exp", reason = "platform-dependent; use libm" },
    { path = "f32::exp2", reason = "platform-dependent; use libm" },
    { path = "f32::exp_m1", reason = "platform-dependent; use libm" },
    { path = "f32::ln", reason = "platform-dependent; use libm" },
    { path = "f32::ln_1p", reason = "platform-dependent; use libm" },
    { path = "f32::log", reason = "platform-dependent; use libm" },
    { path = "f32::log2", reason = "platform-dependent; use libm" },
    { path = "f32::log10", reason = "platform-dependent; use libm" },
    { path = "f32::powf", reason = "platform-dependent; use libm" },
    { path = "f32::hypot", reason = "platform-dependent; use libm" },
    { path = "f32::cbrt", reason = "platform-dependent; use libm" },
    { path = "f32::powi", reason = "platform-dependent; multiply explicitly" },
    { path = "f64::sin", reason = "platform-dependent; use libm" },
    { path = "f64::cos", reason = "platform-dependent; use libm" },
    { path = "f64::tan", reason = "platform-dependent; use libm" },
    { path = "f64::asin", reason = "platform-dependent; use libm" },
    { path = "f64::acos", reason = "platform-dependent; use libm" },
    { path = "f64::atan", reason = "platform-dependent; use libm" },
    { path = "f64::atan2", reason = "platform-dependent; use libm" },
    { path = "f64::sin_cos", reason = "platform-dependent; use libm" },
    { path = "f64::sinh", reason = "platform-dependent; use libm" },
    { path = "f64::cosh", reason = "platform-dependent; use libm" },
    { path = "f64::tanh", reason = "platform-dependent; use libm" },
    { path = "f64::exp", reason = "platform-dependent; use libm" },
    { path = "f64::exp2", reason = "platform-dependent; use libm" },
    { path = "f64::exp_m1", reason = "platform-dependent; use libm" },
    { path = "f64::ln", reason = "platform-dependent; use libm" },
    { path = "f64::ln_1p", reason = "platform-dependent; use libm" },
    { path = "f64::log", reason = "platform-dependent; use libm" },
    { path = "f64::log2", reason = "platform-dependent; use libm" },
    { path = "f64::log10", reason = "platform-dependent; use libm" },
    { path = "f64::powf", reason = "platform-dependent; use libm" },
    { path = "f64::hypot", reason = "platform-dependent; use libm" },
    { path = "f64::cbrt", reason = "platform-dependent; use libm" },
    { path = "f64::powi", reason = "platform-dependent; multiply explicitly" },
    { path = "f32::mul_add", reason = "rounds differently from a * b + c, and its software fallback varies by platform" },
    { path = "f64::mul_add", reason = "rounds differently from a * b + c, and its software fallback varies by platform" },
]
disallowed-types = [
    { path = "std::collections::HashMap", reason = "random iteration order; use sorted order" },
    { path = "std::collections::HashSet", reason = "random iteration order; use sorted order" },
]
