[package]
name = "sim"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
brick-store.workspace = true
net.workspace = true
planet-gen.workspace = true
# The movement config is TOML read through serde, as the Material table is. Neither touches the
# GPU, so the server can link this crate.
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.1.6", default-features = false, features = ["std", "serde", "parse"] }
