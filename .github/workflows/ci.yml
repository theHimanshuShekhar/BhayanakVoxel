name: CI

# Which jobs gate and which do not, and how to bump the pins: docs/agents/ci.md.
#
# Runner images are named, not `-latest`, so that a new image cannot break main with no code change.
# `windows-2025-vs2026` is what `windows-latest` resolved to on 2026-11-11. Rust is pinned in
# rust-toolchain.toml and installed by .github/actions/setup-rust.

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      # lavapipe is a software Vulkan driver, so render tests can create a device without a GPU.
      - name: Install lavapipe
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # This includes the bench smoke test (bins/client/tests/bench.rs): `client bench --short` on
      # lavapipe, with the report's schema checked. Its timings are not looked at.
      # The client tests that are about real threads or real time are skipped here; the
      # real-thread-tests job runs them (.github/real-thread-tests.txt lists them). The streaming
      # tests that are about behaviour run stepped (no threads, no sleeps) and are run here.
      - name: cargo test --workspace, without the real-thread tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t filters < <(tr -d '\r' < .github/real-thread-tests.txt | grep -vE '^\s*(#|$)')
          skips=()
          for f in "${filters[@]}"; do skips+=(--skip "$f"); done
          cargo test --workspace -- "${skips[@]}"
        env:
          # Where the golden image test writes actual.png, expected.png and diff.png on a mismatch.
          GOLDEN_FAILURE_DIR: ${{ github.workspace }}/golden-failures
      # The gating jobs skip a listed filter in the whole workspace, the real-thread job runs it in
      # the client binary only: a line that matches another crate's test would run it nowhere.
      - name: Real-thread list matches no test outside the client binary
        run: bash .github/scripts/check-real-thread-list.sh outside
      - name: Upload golden image failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-image-failures
          path: golden-failures
          if-no-files-found: ignore
      - name: Server must not depend on wgpu or winit
        shell: bash
        run: |
          set -euo pipefail
          deps=$(cargo tree -p server -e normal --prefix none --target all)
          if grep -E '^(wgpu|winit)' <<<"$deps"; then
            echo "::error::server must not depend on wgpu or winit"
            exit 1
          fi

  # The client tests that are about real threads or real time (the frame thread's milliseconds, a
  # thread that is busy or panics), on both platforms. Some of them wait on wall-clock time and so
  # fail now and then. `continue-on-error` keeps a failure here from failing the workflow. The
  # streaming tests of behaviour run stepped, single-threaded, in the gating jobs.
  real-thread-tests:
    name: real-thread-tests (${{ matrix.os }})
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      # A line of the list that matches no test is a stale line: this job fails. The Linux leg
      # checks, since the `priority::` test is Linux's only.
      - name: Every line of the list matches a test
        if: runner.os == 'Linux'
        run: bash .github/scripts/check-real-thread-list.sh unmatched
      # These tests need no GPU. The client's unit tests are one binary, so `--bin client` leaves
      # out tests/bench.rs, which does.
      - name: Run the real-thread tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t filters < <(tr -d '\r' < .github/real-thread-tests.txt | grep -vE '^\s*(#|$)')
          cargo test -p client --bin client -- "${filters[@]}"

  # Windows is the game's target. The runners have no Vulkan driver, so nothing here may need a GPU:
  # no `render` tests and no tests/bench.rs.
  windows-tests:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - name: Tests of the crates that need no GPU
        run: cargo test -p brick-store -p materials -p net -p planet-gen -p sim -p prefetch-sim -p server
      # The client's unit tests, minus the real-thread tests and the three that make an Offscreen
      # renderer (a Vulkan device): the cave stills, the landscape golden and the Edit stress of the bench.
      - name: Client tests that need no GPU, without the real-thread tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t filters < <(tr -d '\r' < .github/real-thread-tests.txt | grep -vE '^\s*(#|$)')
          skips=(
            --skip bench::caves::tests::the_stills_are_timed_and_photographed
            --skip bench::landscape::the_landscape_from_the_ground_500_m_and_20_km_matches_the_approved_images
            --skip bench::edits::tests::the_largest_brush_is_dug_and_placed_in_turn_at_no_more_than_the_metric_rate
          )
          for f in "${filters[@]}"; do skips+=(--skip "$f"); done
          cargo test -p client --bin client -- "${skips[@]}"

  windows-client:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - run: cargo build --release -p client
      - uses: actions/upload-artifact@v4
        with:
          name: client-windows
          path: target/release/client.exe
          if-no-files-found: error

  # Every runner checks the same committed golden hashes, so passing everywhere means the
  # runners agree with each other (ADR 0003).
  determinism:
    name: determinism (${{ matrix.os }}, ${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025-vs2026]
        profile: [debug, release]
        include:
          # The workspace optimises these crates in dev builds so that tests run fast; undo that
          # here so that the debug leg really tests unoptimised code.
          - profile: debug
            flags: --config profile.dev.package.planet-gen.opt-level=0 --config profile.dev.package.brick-store.opt-level=0 --config profile.dev.package.sim.opt-level=0
          - profile: release
            flags: --release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ${{ matrix.profile }}
      - run: cargo test ${{ matrix.flags }} -p planet-gen -p sim golden
