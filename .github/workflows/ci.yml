name: CI

# Which jobs gate and which do not, and how to bump the pins: docs/agents/ci.md.
#
# Runner images are named, not `-latest`, so that a new image cannot break main with no code change.
# `windows-2025-vs2026` is what `windows-latest` resolved to on 2026-11-11. Rust is pinned in
# rust-toolchain.toml and installed by .github/actions/setup-rust.

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # fmt, clippy, the doctests, the checks of the real-thread list, and the server's dependencies. The
  # tests themselves are the `linux-tests` shards below.
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-nextest
      # lavapipe is a software Vulkan driver, so render tests can create a device without a GPU.
      - name: Install lavapipe
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # nextest does not run doctests.
      - run: cargo test --doc --workspace
      # The gating jobs skip a listed filter in the whole workspace, the real-thread job runs it in
      # the client binary only: a line that matches another crate's test would run it nowhere.
      # Also: nextest's filterset (the gating jobs') and libtest's filters (the real-thread job's)
      # select the same tests, and the counts of each side are in the log.
      - name: Real-thread list matches no test outside the client binary, and nextest agrees
        run: bash .github/scripts/check-real-thread-list.sh all
      - name: Server must not depend on wgpu or winit
        shell: bash
        run: |
          set -euo pipefail
          deps=$(cargo tree -p server -e normal --prefix none --target all)
          if grep -E '^(wgpu|winit)' <<<"$deps"; then
            echo "::error::server must not depend on wgpu or winit"
            exit 1
          fi

  # Every test of the workspace but the real-thread ones, with cargo-nextest, in three shards that run
  # in parallel (`--partition hash`: a test's shard is a hash of its name, so it is the same on every
  # run, and the three together run every test once). This includes the bench smoke test
  # (bins/client/tests/bench.rs): `client bench --short` on lavapipe, with the report's schema checked.
  # Its timings are not looked at. The client tests that are about real threads or real time are left
  # out here; the real-thread-tests job runs them (.github/real-thread-tests.txt lists them). The
  # streaming tests that are about behaviour run stepped (no threads, no sleeps) and are run here.
  linux-tests:
    name: linux-tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-nextest
      - name: Install lavapipe
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: cargo nextest run, without the real-thread tests
        shell: bash
        run: |
          set -euo pipefail
          filterset=$(bash .github/scripts/real-thread-filterset.sh)
          cargo nextest run --workspace --no-fail-fast \
            --partition hash:${{ matrix.shard }}/3 -E "not ($filterset)"
        env:
          # Where the golden image test writes actual.png, expected.png and diff.png on a mismatch.
          GOLDEN_FAILURE_DIR: ${{ github.workspace }}/golden-failures
      - name: Upload golden image failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-image-failures-${{ matrix.shard }}
          path: golden-failures
          if-no-files-found: ignore

  # The client tests that are about real threads or real time (the frame thread's milliseconds, a thread that is busy or panics), and the
  # sim's two wall-clock tests (an ignored test each: the kilometre walk's tick time and the server thread's 60 Hz), on both platforms. Some of
  # them wait on wall-clock time and so fail now and then. `continue-on-error` keeps a failure here from failing the workflow. The
  # streaming tests of behaviour run stepped, single-threaded, in the gating jobs.
  real-thread-tests:
    name: real-thread-tests (${{ matrix.os }})
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      # A line of the list that matches no test is a stale line: this job fails. The Linux leg
      # checks, since the `priority::` test is Linux's only.
      - name: Every line of the list matches a test
        if: runner.os == 'Linux'
        run: bash .github/scripts/check-real-thread-list.sh unmatched
      # These tests need no GPU. The client's unit tests are one binary, so `--bin client` leaves
      # out tests/bench.rs, which does.
      - name: Run the real-thread tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t filters < <(tr -d '\r' < .github/real-thread-tests.txt | grep -vE '^\s*(#|$)')
          cargo test -p client --bin client -- "${filters[@]}"
      # Wall-clock limits of tests of other crates, which are `#[ignore]`d so that they do not gate (#193): the sim's tick time over the
      # kilometre walk and the server thread's 60 Hz, whose counted twins gate. It runs even when the step before it failed (that one is
      # flaky), since those are the runs it is for. A filter that matches no test passes with nothing run, so it checks that two ran.
      - name: Run the wall-clock tests of the sim
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p sim --test walk -- --ignored --nocapture a_tick_of_the_kilometre_walk 2>&1 | tee walk.out
          cargo test -p sim --lib -- --ignored on_its_own_thread_it_ticks_at_about_60_hz 2>&1 | tee -a walk.out
          [ "$(grep -c '^test result: .* 1 passed' walk.out)" -eq 2 ] || { echo "::error::a wall-clock test of the sim did not run"; exit 1; }

  # Windows is the game's target. The runners have no Vulkan driver, so nothing here may need a GPU:
  # no `render` tests and no tests/bench.rs. The tests of the crates that need no GPU and the client's
  # unit tests, minus the real-thread tests and the six that make an Offscreen renderer (a Vulkan
  # device): the cave stills, the landscape golden, the crystals golden, the Edit stress of the bench,
  # the look-dev smoke run and the log of the hardware backend's updates. Run with cargo-nextest in
  # two shards (`--partition hash`, as `linux-tests` does).
  windows-tests:
    name: windows-tests (${{ matrix.shard }}/2)
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-nextest
      - name: Tests that need no GPU, without the real-thread tests
        shell: bash
        run: |
          set -euo pipefail
          filterset=$(bash .github/scripts/real-thread-filterset.sh)
          gpu='test(~bench::caves::tests::the_stills_are_timed_and_photographed)'
          gpu+=' | test(~bench::landscape::the_landscape_from_the_ground_500_m_and_20_km_matches_the_approved_images)'
          gpu+=' | test(~bench::crystals::a_cluster_on_a_sunlit_slope_and_a_crystal_cave_match_the_approved_images)'
          gpu+=' | test(~bench::edits::tests::the_largest_brush_is_dug_and_placed_in_turn_at_no_more_than_the_metric_rate)'
          gpu+=' | test(~bench::lookdev::run::tests::a_short_run_writes_a_folder_for_each_shot_and_a_sheet_that_names_every_image)'
          gpu+=' | test(~bench::tests::the_flights_updates_are_logged_by_where_in_the_run_they_were_made)'
          cargo nextest run --no-fail-fast --partition hash:${{ matrix.shard }}/2 \
            -p brick-store -p materials -p net -p planet-gen -p sim -p prefetch-sim -p server -p client \
            -E "not ($filterset) and not ($gpu) and not binary_id(client::bench)"
      # nextest does not run doctests.
      - run: cargo test --doc -p brick-store -p materials -p net -p planet-gen -p sim -p prefetch-sim -p server
        if: matrix.shard == 1

  windows-client:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - run: cargo build --release -p client
      - uses: actions/upload-artifact@v4
        with:
          name: client-windows
          path: target/release/client.exe
          if-no-files-found: error

  # Every runner checks the same committed golden hashes, so passing everywhere means the
  # runners agree with each other (ADR 0003).
  determinism:
    name: determinism (${{ matrix.os }}, ${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025-vs2026]
        profile: [debug, release]
        include:
          # The workspace optimises these crates in dev builds so that tests run fast; undo that
          # here so that the debug leg really tests unoptimised code.
          - profile: debug
            flags: --config profile.dev.package.planet-gen.opt-level=0 --config profile.dev.package.brick-store.opt-level=0 --config profile.dev.package.sim.opt-level=0
          - profile: release
            flags: --release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ${{ matrix.profile }}
      - run: cargo test ${{ matrix.flags }} -p planet-gen -p sim golden
