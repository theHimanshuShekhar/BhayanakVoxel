[workspace]
resolver = "3"
members = ["crates/*", "bins/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
brick-store = { path = "crates/brick-store" }
planet-gen = { path = "crates/planet-gen" }
sim = { path = "crates/sim" }
net = { path = "crates/net" }
render = { path = "crates/render" }

# wgpu is pinned to one exact version; each upgrade is a deliberate task (ADR 0001).
# Vulkan is the only supported backend, so the other backends are not compiled in.
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl"] }
winit = "0.30.13"
# egui 0.37 is the release line that builds against wgpu 30 and winit 0.30.13. The three crates
# release in lockstep, so they are pinned together. egui-wgpu's default features turn on every
# wgpu backend; Vulkan is the only one supported (ADR 0001).
egui = "=0.37.0"
egui-wgpu = { version = "=0.37.0", default-features = false }
egui-winit = { version = "=0.37.0", default-features = false, features = ["x11", "wayland"] }

[profile.dev]
# Keeps the shared target dir from filling the disk.
debug = "line-tables-only"
incremental = false

# Tests generate regions of the test Planet, which is slow unoptimised. Output is bit-identical
# in every profile (ADR 0003).
[profile.dev.package.planet-gen]
opt-level = 3

[profile.dev.package.brick-store]
opt-level = 3
