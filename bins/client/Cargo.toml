[package]
name = "client"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
brick-store.workspace = true
egui.workspace = true
egui-winit.workspace = true
net.workspace = true
planet-gen.workspace = true
render.workspace = true
sim.workspace = true
winit.workspace = true
# The bench harness reads TOML budgets and writes a JSON report and PNG screenshots.
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = { version = "1.1.6", default-features = false, features = ["std", "serde", "parse"] }

# The loader's worker threads run at the lowest priority (src/priority.rs), which the standard
# library cannot ask for. Both crates are in the build already, through winit.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }
