# Default budgets for `client bench`: milliseconds of GPU time per frame, on the dev's RTX 4090
# at 1440p output (1280x720 traced internally). A pass whose mean time over the run is above its
# budget is marked "over", fails the run (exit status 2), and blocks the merge of the PR (#13).
#
# This file is compiled into the executable. `client bench --budgets FILE` uses another file
# instead; a copy of this one is the place to start.
#
# The numbers come from the rendering decision (#10, "Frame budget"). A stage gets a line here
# once there is a pass of that name; the rest are listed, commented out, for whoever adds the
# pass. A budget for a pass that does not run is ignored (the report lists it); a pass that ran
# but could not be timed, because the GPU lacks timestamp queries, is "no-data" and fails the
# run, since nothing was checked.

# By pass name, wherever the pass runs.
[passes]
# M1a: primary visibility, 1 ray per pixel.
primary = 1.0

# The reference path tracer is the ground truth and has no budget in #10. This catches a gross
# regression of one sample: the first run on the 4090 (bdbba3d, the planet flyover) measured a
# mean of 1.10 ms a sample, p95 2.69 ms.
reference = 3.0

# TAAU (#51): the upscale pass builds the 1440p image from the 1280x720 one and its history.
upscale = 0.5

# Edits and BVH updates (#10, 1 ms), held at the metric Edit rate (8 m3/s, #147): the mean over
# every frame of the Edit stress of the whole-Planet bench, in which the largest Brush is dug and
# placed in turn at the rate the server allows. It is CPU time (the Edit applied, the scene
# packed, the writes sent), and not a GPU pass.
edits = 1.0

# The longest Edit of the same stress on the frame thread (#156): planning it and changing level 0
# of the Voxels, and sending the writes to the GPU. The mean above is over all 1 800 frames, so an
# Edit that costs 40 ms (it did, at 5 cm, before) is 0.1 ms of it. The coarse levels and the
# packing are the scene thread's, which the frame thread does not wait for, and are not in this.
# The bench runs the parts on one thread, so the waits of the real frame thread are not in it
# either (a release test of the client holds them).
# It is a maximum, not a mean: one hitch fails the run. 4 ms is a quarter of a 16.7 ms frame, the
# most that one Edit should take of it, with the largest cube planned and written in about 1 to 3.
edit_frame_thread = 4.0

# Sun shadows (#52): the `shadows` pass, two shadow rays a pixel from the G-buffer.
shadows = 0.4

# The atmosphere (#53): the `atmosphere` pass, the tables of Hillaire's atmosphere (the sky-view
# table and the aerial-perspective volumes every frame; the transmittance, multiple-scattering and
# sun-free tables only when the air or the sun's height changes).
atmosphere = 0.3

# GI (#54): the `gi` pass, one bounce and an emitter sample a pixel from the G-buffer, and the
# world-space radiance cache that supplies the bounces after it (the cache's fill and its resolve
# are in it).
gi = 1.5

# M1 stages from #10, for when the passes exist (the names are suggestions):
# reflections  = 0.7
# glass        = 0.7
# volumetrics  = 1.0
# denoise      = 1.0
# post         = 0.5   # post-processing and UI (the window's blit and overlay passes are not
#                      # run by the offscreen bench)

# The gates of the real-time streaming mode (`--streaming --real-time`, #162): the full-size Planet
# with the real loader workers and scene thread, on the 4090. Each is held to the worst of the runs
# (three by default), and a run over any of them fails with exit status 2. Every key is needed.
[streaming]
# Frame time, p99 of the frames of each path: a 60 Hz frame (spec: "Generation and streaming").
frame_time_p99_ms = 16.7
# CPU time of the frame thread (recentring, the copy to the GPU, encoding the frame), p99 of each
# path: half a frame.
frame_cpu_p99_ms = 8.0
# Holes, found by the scene thread's looks at every split brick, summed over the runs: none, ever.
holes = 0
# The scene's buffers in use, at the most: the full-size test's 512 MiB (474 MiB measured, #143).
# The store's budget is not here: the store holds its own (`STREAMED_PER_D0_SQUARED`, with the
# overflow), and the report's peak is held to that limit.
scene_mib = 512.0
# Soft misses under the camera (ADR 0009, #168): the frames in which the ground straight below the
# frame's camera is drawn coarser than the speed-scaled bands ask at its distance, summed over the
# flight at 2 m, the flight at 50 m, the vertical take-off and the 180 degree turn: none. (The scene
# thread's own count, against the scene's lagging camera, is reported and not gated.)
camera_soft_miss_frames = 0
# How far behind the camera the drawn scene is, in d0, at the most over those four flights. Main's
# value on the 4090 is 7.81 d0 at 50 m: this is that plus a margin, FOR NOW. It tightens to about
# 2 d0 once the follow fixes land (docs/agents/benchmarking.md).
scene_lag_d0_max = 8.0
# The spawn ring (#168): seconds to make the 20 m of full detail round the Spawn, where the player
# has control (ADR 0009).
spawn_ring_s = 2.0
# Time to control as the player sees it: seconds from the world map being ready to the window
# opening, the ring and the Guard both (the window waits for the Guard so that nothing past the ring
# is sky). "Control in 2 s with no sky" is NOT met: it is #220 (a background Guard). Held at what it
# measures now (4.3 s on the 4090, 7 s on the loaded dev box) plus a margin.
time_to_control_s = 10.0
# Settle time (#168): seconds from the camera stopping after a flight at 50 m/s to a scene that is at
# the camera, has no soft miss and has nothing left to look at again for the bands. Main's value on
# the 4090 is 47.8 s; this is that plus 15%. A run that has not settled at the cap (120 s) is over
# whatever this is.
settle_s = 55.0

# The GPU time of one profiler frame, by mode: from the start of its first pass to the end of
# its last. In primary mode that is one frame of the path. In reference mode every sample is a
# profiler frame of its own, so `gpu_total.reference` budgets one sample, not the frames' worth
# of samples that the camera path's frame draws.
[gpu_total]
# M1 total from #10 (about 9 ms of GPU work in a 16.7 ms frame).
primary = 8.6
# One reference sample, measured like the reference pass above.
reference = 3.0
