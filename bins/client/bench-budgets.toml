# Default budgets for `client bench`: milliseconds of GPU time per frame, on the dev's RTX 4090
# at 1440p output (1280x720 traced internally). A pass whose mean time over the run is above its
# budget is marked "over", fails the run (exit status 2), and blocks the merge of the PR (#13).
#
# This file is compiled into the executable. `client bench --budgets FILE` uses another file
# instead; a copy of this one is the place to start.
#
# The numbers come from the rendering decision (#10, "Frame budget"). A stage gets a line here
# once there is a pass of that name; the rest are listed, commented out, for whoever adds the
# pass. A budget for a pass that does not run is ignored (the report lists it); a pass that ran
# but could not be timed, because the GPU lacks timestamp queries, is "no-data" and fails the
# run, since nothing was checked.

# By pass name, wherever the pass runs.
[passes]
# M1a: primary visibility, 1 ray per pixel.
primary = 1.0

# The reference path tracer is the ground truth and has no budget in #10. This catches a gross
# regression of one sample: the first run on the 4090 (bdbba3d, the planet flyover) measured a
# mean of 1.10 ms a sample, p95 2.69 ms.
reference = 3.0

# TAAU (#51): the upscale pass builds the 1440p image from the 1280x720 one and its history.
upscale = 0.5

# Edits and BVH updates (#10, 1 ms), held at the metric Edit rate (8 m3/s, #147): the mean over
# every frame of the Edit stress of the whole-Planet bench, in which the largest Brush is dug and
# placed in turn at the rate the server allows. It is CPU time (the Edit applied, the scene
# packed, the writes sent), and not a GPU pass.
edits = 1.0

# The longest Edit of the same stress on the frame thread (#156): planning it and changing level 0
# of the Voxels, and sending the writes to the GPU. The mean above is over all 1 800 frames, so an
# Edit that costs 40 ms (it did, at 5 cm, before) is 0.1 ms of it. The coarse levels and the
# packing are the scene thread's, which the frame thread does not wait for, and are not in this.
# The bench runs the parts on one thread, so the waits of the real frame thread are not in it
# either (a release test of the client holds them).
# It is a maximum, not a mean: one hitch fails the run. 4 ms is a quarter of a 16.7 ms frame, the
# most that one Edit should take of it, with the largest cube planned and written in about 1 to 3.
edit_frame_thread = 4.0

# M1 stages from #10, for when the passes exist (the names are suggestions):
# shadows      = 0.4   # sun shadows, 1 ray/px
# gi           = 1.5   # GI bounce and radiance cache
# reflections  = 0.7
# glass        = 0.7
# volumetrics  = 1.0
# denoise      = 1.0
# atmosphere   = 0.3
# post         = 0.5   # post-processing and UI (the window's blit and overlay passes are not
#                      # run by the offscreen bench)

# The GPU time of one profiler frame, by mode: from the start of its first pass to the end of
# its last. In primary mode that is one frame of the path. In reference mode every sample is a
# profiler frame of its own, so `gpu_total.reference` budgets one sample, not the frames' worth
# of samples that the camera path's frame draws.
[gpu_total]
# M1 total from #10 (about 9 ms of GPU work in a 16.7 ms frame).
primary = 8.6
# One reference sample, measured like the reference pass above.
reference = 3.0
